# =============================================================================
# Presenton Docker Compose Configuration
# =============================================================================
# Configure via .env file (recommended):
#   1. Copy .env.example to .env
#   2. Edit .env with your values
#   3. Run: docker-compose up production
#
# Or pass environment variables directly:
#   docker-compose up production -e OPENAI_API_KEY=sk-xxx
# =============================================================================

services:
  postgres:
    image: postgres:16
    ports:
      - "${POSTGRES_PORT:-5432}:5432"  # Expose PostgreSQL for external access/management tools
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-presenton}
      POSTGRES_USER: ${POSTGRES_USER:-presenton}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-presenton}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - presenton_network

  production:
    # image: ghcr.io/presenton/presenton:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_OLLAMA: ${INSTALL_OLLAMA:-false}
    ports:
      # You can replace 5000 with any other port number of your choice to run Presentation Agent on a different port number.
      - "5000:80"
    volumes:
      - ./app_data:/app_data
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Application Configuration
      - CAN_CHANGE_KEYS=${CAN_CHANGE_KEYS}
      - ENABLE_CUSTOM_TEMPLATES=${ENABLE_CUSTOM_TEMPLATES:-false}
      - DISABLE_ANONYMOUS_TRACKING=${DISABLE_ANONYMOUS_TRACKING}

      # Database
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-presenton}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-presenton}}

      # LLM Provider
      - LLM=${LLM}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GOOGLE_MODEL=${GOOGLE_MODEL}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL}
      - OLLAMA_URL=${OLLAMA_URL}
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      - CUSTOM_LLM_URL=${CUSTOM_LLM_URL}
      - CUSTOM_LLM_API_KEY=${CUSTOM_LLM_API_KEY}
      - CUSTOM_MODEL=${CUSTOM_MODEL}

      # LLM Features
      - TOOL_CALLS=${TOOL_CALLS}
      - DISABLE_THINKING=${DISABLE_THINKING}
      - EXTENDED_REASONING=${EXTENDED_REASONING}
      - WEB_GROUNDING=${WEB_GROUNDING}

      # Image Generation
      - IMAGE_PROVIDER=${IMAGE_PROVIDER}
      - PEXELS_API_KEY=${PEXELS_API_KEY}
      - PIXABAY_API_KEY=${PIXABAY_API_KEY}
    networks:
      - presenton_network

  production-gpu:
    # image: ghcr.io/presenton/presenton:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_OLLAMA: ${INSTALL_OLLAMA:-false}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      # You can replace 5000 with any other port number of your choice to run Presentation Agent on a different port number.
      - "5000:80"
    volumes:
      - ./app_data:/app_data
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Application Configuration
      - CAN_CHANGE_KEYS=${CAN_CHANGE_KEYS}
      - ENABLE_CUSTOM_TEMPLATES=${ENABLE_CUSTOM_TEMPLATES:-false}
      - DISABLE_ANONYMOUS_TRACKING=${DISABLE_ANONYMOUS_TRACKING}

      # Database
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-presenton}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-presenton}}

      # LLM Provider
      - LLM=${LLM}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GOOGLE_MODEL=${GOOGLE_MODEL}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL}
      - OLLAMA_URL=${OLLAMA_URL}
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      - CUSTOM_LLM_URL=${CUSTOM_LLM_URL}
      - CUSTOM_LLM_API_KEY=${CUSTOM_LLM_API_KEY}
      - CUSTOM_MODEL=${CUSTOM_MODEL}

      # LLM Features
      - TOOL_CALLS=${TOOL_CALLS}
      - DISABLE_THINKING=${DISABLE_THINKING}
      - EXTENDED_REASONING=${EXTENDED_REASONING}
      - WEB_GROUNDING=${WEB_GROUNDING}

      # Image Generation
      - IMAGE_PROVIDER=${IMAGE_PROVIDER}
      - PEXELS_API_KEY=${PEXELS_API_KEY}
      - PIXABAY_API_KEY=${PIXABAY_API_KEY}
    networks:
      - presenton_network

  development:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        INSTALL_OLLAMA: ${INSTALL_OLLAMA:-false}
    ports:
      - "5000:80"
    volumes:
      - .:/app
      - ./app_data:/app_data
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Application Configuration
      - CAN_CHANGE_KEYS=${CAN_CHANGE_KEYS}
      - ENABLE_CUSTOM_TEMPLATES=${ENABLE_CUSTOM_TEMPLATES:-false}
      - DISABLE_ANONYMOUS_TRACKING=${DISABLE_ANONYMOUS_TRACKING}

      # Database
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-presenton}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-presenton}}

      # LLM Provider
      - LLM=${LLM}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GOOGLE_MODEL=${GOOGLE_MODEL}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL}
      - OLLAMA_URL=${OLLAMA_URL}
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      - CUSTOM_LLM_URL=${CUSTOM_LLM_URL}
      - CUSTOM_LLM_API_KEY=${CUSTOM_LLM_API_KEY}
      - CUSTOM_MODEL=${CUSTOM_MODEL}

      # LLM Features
      - TOOL_CALLS=${TOOL_CALLS}
      - DISABLE_THINKING=${DISABLE_THINKING}
      - EXTENDED_REASONING=${EXTENDED_REASONING}
      - WEB_GROUNDING=${WEB_GROUNDING}

      # Image Generation
      - IMAGE_PROVIDER=${IMAGE_PROVIDER}
      - PEXELS_API_KEY=${PEXELS_API_KEY}
      - PIXABAY_API_KEY=${PIXABAY_API_KEY}
    networks:
      - presenton_network

  development-gpu:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        INSTALL_OLLAMA: ${INSTALL_OLLAMA:-false}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "5000:80"
    volumes:
      - .:/app
      - ./app_data:/app_data
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Application Configuration
      - CAN_CHANGE_KEYS=${CAN_CHANGE_KEYS}
      - ENABLE_CUSTOM_TEMPLATES=${ENABLE_CUSTOM_TEMPLATES:-false}
      - DISABLE_ANONYMOUS_TRACKING=${DISABLE_ANONYMOUS_TRACKING}

      # Database
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-presenton}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-presenton}}

      # LLM Provider
      - LLM=${LLM}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GOOGLE_MODEL=${GOOGLE_MODEL}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL}
      - OLLAMA_URL=${OLLAMA_URL}
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      - CUSTOM_LLM_URL=${CUSTOM_LLM_URL}
      - CUSTOM_LLM_API_KEY=${CUSTOM_LLM_API_KEY}
      - CUSTOM_MODEL=${CUSTOM_MODEL}

      # LLM Features
      - TOOL_CALLS=${TOOL_CALLS}
      - DISABLE_THINKING=${DISABLE_THINKING}
      - EXTENDED_REASONING=${EXTENDED_REASONING}
      - WEB_GROUNDING=${WEB_GROUNDING}

      # Image Generation
      - IMAGE_PROVIDER=${IMAGE_PROVIDER}
      - PEXELS_API_KEY=${PEXELS_API_KEY}
      - PIXABAY_API_KEY=${PIXABAY_API_KEY}
    networks:
      - presenton_network

networks:
  presenton_network:
    driver: bridge

volumes:
  postgres_data:
